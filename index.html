<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>


<h1>Lost & Found</h1>
<p>Enter a description here</p>
<body>

    <textarea id="description_raw" name="item" rows="15" cols="40"></textarea>

    <!-- Using Vanilla JavaScript with Textarea HTML
        Reference: https://mimo.org/glossary/html/textarea -->


    <button onclick="sendRawDescription()">Submit</button>
    <!-- TEST <button onclick="callHelloWorld()">HELLO SERVER</button> -->


    <script>
        async function sendRawDescription() {
            const textareaValue = document.getElementById("description_raw").value;

            try {
                // Send POST to a FastAPI Server
                const response = await fetch("http://127.0.0.1:8000/api/process", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    // Convert the value to a JSON object
                    body: JSON.stringify({ text: textareaValue })
                });

                // Parse a HTTP response to a JSON
                const result = await response.json();
                console.log("Result:", result);
                
            } catch (error) {
                console.error("SERVER ERROR:", error);
            }
        }

</body>
</html>
