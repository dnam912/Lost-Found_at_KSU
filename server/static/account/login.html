<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In | Lost & Found</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/account/auth.css">
</head>
<body>
    <header class="site-header">
        <h1>Lost & Found</h1>
        <a class="back-button" href="/static/index.html">Back</a>
    </header>

    <main class="auth-main">
        <section class="auth-panel" aria-labelledby="auth-title">
            <h1 id="auth-title">Welcome back</h1>
            <p class="subtitle">Log in using your Kent State account</p>

            <form id="login-form" class="auth-form">
                <label for="email">Kent State Email</label>
                <input id="email" name="email" type="email" placeholder="name@kent.edu"
                       autocomplete="username" maxlength="254" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password"
                       autocomplete="current-password" required>

                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
                <button class="primary-button" type="submit">Log In</button>
            </form>

            <p class="switch-page">Don't have an account? <a href="/static/account/signup.html">Sign up</a></p>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="/static/account/auth.js"></script>
</body>
</html>
