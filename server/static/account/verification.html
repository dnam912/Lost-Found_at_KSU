<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Email | Lost & Found</title>
    <link rel="stylesheet" href="/static/account/auth.css">
</head>
<body>
    <header class="site-header">
        <h1>Lost & Found</h1>
        <a class="back-button" href="/static/account/signup.html">Back</a>
    </header>

    <main class="auth-main">
        <section class="auth-panel" aria-labelledby="auth-title">
            <h1 id="auth-title">Verify your email</h1>
            <p class="subtitle">Enter the 6-digit verification code sent to your Kent State email.</p>

            <form class="auth-form" id="verification-form">
                <label for="verification-code">Verification Code</label>
                <input id="verification-code" name="code" type="text" inputmode="numeric"
                       autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"
                       placeholder="Enter 6-digit code" required>
                <button class="primary-button" type="button" disabled title="Verification is not connected yet">Verify Email</button>
            </form>
            <p class="switch-page">Didn't receive the code? <button class="resend-link" type="button" disabled title="Email sending is not connected yet">Resend Code</button></p>
        </section>
    </main>
</body>
</html>
