<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost & Found</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <h1>Lost & Found</h1>
        <a class="account-button" href="/static/account/login.html">Account</a>
    </header>

    <main>
        <section class="matching-section" id="matching_section" aria-labelledby="matching_title" hidden>
            <h2 id="matching_title">Top Matching Items</h2>
            <p class="matching-subtitle">Closest matches based on your description</p>
            <div class="matching-grid" id="matching_items"></div>
        </section>

        <section class="entry-section" aria-labelledby="entry_title">
            <h2 id="entry_title">Enter item details</h2>
            <form class="item-form" id="report_form">
                <div class="form-row">
                    <span class="field-label">Status</span>
                    <div class="status-toggle" role="group" aria-label="Item status">
                        <label><input type="radio" name="item_status" value="Lost" checked>Lost</label>
                        <label><input type="radio" name="item_status" value="Found">Found</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="estimated_date">Date</label>
                    <input type="text" id="estimated_date" placeholder="mm/dd/yyyy" required>
                </div>

                <div class="form-row">
                    <span class="field-label">Estimated Time</span>
                    <div class="time-fields">
                        <input type="time" id="estimated_start" aria-label="Estimated start time">
                        <input type="time" id="estimated_end" aria-label="Estimated end time">
                    </div>
                </div>

                <div class="form-row">
                    <label for="location_select">Location</label>
                    <select id="location_select" required>
                        <option value="" selected disabled>Select...</option>
                        <option value="Student Center">Student Center</option>
                        <option value="Math and Science Building">Math and Science Building</option>
                        <option value="Library">Library</option>
                    </select>
                </div>

                <!-- Add this field to the form and API after the database supports area.
                <div class="form-row">
                    <label for="area_input">Area</label>
                    <input type="text" id="area_input" placeholder="room OR nth floor">
                </div>
                -->

                <div class="form-row">
                    <label for="category_input">Category</label>
                    <input type="text" id="category_input" placeholder="item" required>
                </div>

                <div class="form-row">
                    <label for="color_input">Color</label>
                    <input type="text" id="color_input" placeholder="Primary color">
                </div>

                <div class="form-row">
                    <label for="material_input">Material</label>
                    <input type="text" id="material_input" placeholder="Material">
                </div>

                <div class="form-row description-row">
                    <label for="description_raw">Description</label>
                    <textarea id="description_raw" name="item" rows="4" placeholder="Feel free to write it"></textarea>
                </div>

                <div class="form-row">
                    <label for="image_file">Image Upload</label>
                    <input class="upload-control" type="file" id="image_file" accept="image/*, .heic, .HEIC">
                </div>

                <button class="submit-button" type="submit" id="submit_button">Submit</button>
            </form>
        </section>

        <section class="debug-section" aria-labelledby="parsing_title">
            <h2 id="parsing_title">Parsing Output</h2>
            <div id="output"><pre id="json_result">Waiting for input..</pre></div>
        </section>

        <section class="debug-section" aria-labelledby="reports_title">
            <h2 id="reports_title">Lost &amp; Found Reports</h2>
            <div id="reports_container"></div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="/static/script.js"></script>
</body>
</html>
