<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>


<h1>Lost & Found</h1>
<p>Enter a description here</p>
<body>


    <!-- ===== ===== Keywords ===== ===== -->
    <div style="display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin-bottom: 15px;">

        <!-- Image Upload -->
        <div>
            <label for="image_file"><strong>Image Upload:</strong></label><br>
            <input type="file" id="image_file" accept="image/png, image/jpeg, image/jpg" />
        </div>

        <!-- Status Selection -->
        <div>
            <strong>Status:</strong><br>
            <label><input type="radio" name="item_status" value="Lost" checked> Lost</label>
            <label><input type="radio" name="item_status" value="Found"> Found</label>
        </div>

        <!-- Location Dropdown -->
        <div>
            <label for="location_select"><strong>Location:</strong></label><br>
            <select id="location_select">
                <option value="Student Center">Student Center</option>
                <option value="Math and Science Building">Math and Science Building</option>
                <option value="Library">Library</option>
            </select>
        </div>

        <!-- Date -->
        <div>
            <strong>Date:</strong><br>
            <label for="estimated_date">Date (mm/dd/yyyy):</label><br>
            <input type="text" id="estimated_date" placeholder="MM/DD/YYYY" /><br><br>
        </div>

        <!-- Estimated Time (Start & End) -->
        <div>
            <strong>Estimated Time Range:</strong><br>
            <label for="estimated_start">Start:</label>
            <input type="time" id="estimated_start" /><br>
            <label for="estimated_end">End:</label>
            <input type="time" id="estimated_end" />
        </div>

        <!-- Category -->
         <div>
            <label for="category_input"><strong>Category:</strong></label><br>
            <input type="text" id="category_input" placeholder="e.g. Wallet, Electronics, Keys" />
        </div>

        <!-- Color -->
        <div>
            <label for="color_input"><strong>Color:</strong></label><br>
            <input type="text" id="color_input" placeholder="e.g. Black, Navy, Silver" />
        </div>

        <!-- Material -->
        <div>
            <label for="material_input"><strong>Material:</strong></label><br>
            <input type="text" id="material_input" placeholder="e.g. Leather, Plastic, Metal" />
        </div>

    </div>

    <!-- ===== ===== Description ===== ===== -->

    <!-- Using Vanilla JavaScript with Textarea HTML
        Reference: https://mimo.org/glossary/html/textarea
    -->
    <label for="description_raw"><strong>Description:</strong></label><br>
    <textarea id="description_raw" name="item" rows="15" cols="40"></textarea>

    <button onclick="sendRawDescription()">Submit</button>



    <!-- ===== ===== Show a Form Result ===== ===== -->
    <h2>Parsing Output</h2>
    <div id="output" style="background-color: #f4f4f4; padding: 10px; border-radius: 5px;">
        <pre id="json_result">Waiting for input..</pre>
    </div>



    <!-- ===== ===== Javascript ===== ===== -->
    <script>
        async function sendRawDescription() {
            // Metadata (Keywords)
            const statusValue = document.querySelector('input[name="item_status"]:checked').value;
            const locationValue = document.getElementById("location_select").value;
            const dateValue = document.getElementById("estimated_date").value;
            const startValue = document.getElementById("estimated_start").value;
            const endValue = document.getElementById("estimated_end").value;
            const categoryValue = document.getElementById("category_input").value;
            const colorValue = document.getElementById("color_input").value;
            const materialValue = document.getElementById("material_input").value;


            // Text Description
            const textareaValue = document.getElementById("description_raw").value;

            // Image
            const imageFileInput = document.getElementById("image_file");


            // (Text + Image file)
            const formData = new FormData();
            formData.append("status", statusValue);
            formData.append("location", locationValue);
            formData.append("date", dateValue);
            formData.append("estimated_start", startValue);
            formData.append("estimated_end", endValue);
            formData.append("category", categoryValue);
            formData.append("color", colorValue);
            formData.append("material", materialValue);

            formData.append("text", textareaValue);

            // If an image is attached, append the input
            if (imageFileInput.files[0]) {
                formData.append("image", imageFileInput.files[0]);
            }

            try {
                // Send POST to a FastAPI Server
                const response = await fetch("http://127.0.0.1:8000/api/process", {
                    method: "POST",
                    body: formData
                });

                // Parse a HTTP response to a JSON
                const result = await response.json();
                console.log("Result:", result);



                if (result.status === "success") {
                    document.getElementById("json_result").innerText = JSON.stringify(result.parsed_data, null, 2);
                }
                
            } catch (error) {
                console.error("SERVER ERROR:", error);
            }
        }


    </script>


</body>
</html>
